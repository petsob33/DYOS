name: Deploy preview (test-main)

# Hosting-only preview channel deploy. Deliberately does NOT touch Functions,
# Firestore rules or Storage rules — those live in the same production
# Firebase project (dyos-520c2) and a test-main push must never overwrite
# them. Only `main` (deploy-production.yml) deploys those.

on:
  push:
    branches:
      - test-main

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned just before Flutter's IconData became a `final` class
      # (flutter/flutter#181345, landed 2026-03-24): phosphor_flutter 2.1.0
      # (last published 2023, unmaintained) subclasses IconData and fails to
      # compile on anything newer. Bump this once phosphor_flutter is
      # replaced or patched to not extend IconData.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'

      - name: Build Flutter web app for Hosting
        run: |
          flutter pub get
          flutter build web --release

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: dyos-520c2
          channelId: test-main
          expires: 30d
