name: Build Android APK (manual)

# Manual, on-demand release APK build for sideloading/testing. Not signed
# with a release keystore (none is checked into the repo, by design), so
# this uses the debug signing config - installable, but not Play Store
# material. Uploads the APK as a workflow artifact since it's too large
# to hand off any other way.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned just before Flutter's IconData became a `final` class
      # (flutter/flutter#181345, landed 2026-03-24): phosphor_flutter 2.1.0
      # (last published 2023, unmaintained) subclasses IconData and fails to
      # compile on anything newer. Bump this once phosphor_flutter is
      # replaced or patched to not extend IconData.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: dyos-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
