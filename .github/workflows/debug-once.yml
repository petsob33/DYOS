name: Debug Once (temporary diagnostic)

on:
  push:
    branches:
      - debug-diagnostic-run

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Backfill coupleId custom claims for existing couples
        working-directory: functions
        run: |
          node -e "
          const admin = require('firebase-admin');
          admin.initializeApp();
          (async () => {
            const db = admin.firestore();
            const couplesSnap = await db.collection('couples').get();
            console.log('couples found:', couplesSnap.size);
            for (const doc of couplesSnap.docs) {
              const members = doc.data().members;
              if (!Array.isArray(members) || members.length === 0) {
                console.log('skip', doc.id, '- no members array');
                continue;
              }
              await Promise.all(members.map((uid) =>
                admin.auth().setCustomUserClaims(uid, { coupleId: doc.id })
              ));
              console.log('stamped coupleId=' + doc.id + ' on members:', JSON.stringify(members));
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          "

      - name: Apply CORS policy to Storage bucket now (don't wait for next full deploy)
        run: gcloud storage buckets update gs://dyos-520c2.firebasestorage.app --cors-file=cors.json --project=dyos-520c2
