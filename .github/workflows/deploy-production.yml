name: Deploy to Firebase (production)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Deployed first and independently of Hosting: this is what actually
      # matters (e.g. the compressImage fix) and must not be blocked by an
      # unrelated Flutter web build failure.
      - name: Deploy Functions, Firestore rules and Storage rules
        run: npx firebase-tools deploy --project dyos-520c2 --only functions,firestore,storage --non-interactive

      # Storage buckets have no CORS policy by default. Native apps aren't
      # affected, but Flutter Web fetches image bytes via XHR (for
      # CachedNetworkImage/Image.network under CanvasKit), which the browser
      # blocks without this - memory photos silently fail to load on web.
      - name: Apply CORS policy to Storage bucket
        run: gcloud storage buckets update gs://dyos-520c2.firebasestorage.app --cors-file=cors.json --project=dyos-520c2

      # Pinned just before Flutter's IconData became a `final` class
      # (flutter/flutter#181345, landed 2026-03-24): phosphor_flutter 2.1.0
      # (last published 2023, unmaintained) subclasses IconData and fails to
      # compile on anything newer. Bump this once phosphor_flutter is
      # replaced or patched to not extend IconData.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'

      - name: Build Flutter web app for Hosting
        id: build_web
        continue-on-error: true
        run: |
          flutter pub get
          flutter build web --release

      - name: Deploy Hosting
        if: steps.build_web.outcome == 'success'
        run: npx firebase-tools deploy --project dyos-520c2 --only hosting --non-interactive

      - name: Warn if Hosting was skipped
        if: steps.build_web.outcome != 'success'
        run: echo "::warning::Flutter web build failed, Hosting was not deployed. Functions/Firestore/Storage deployed successfully above."
