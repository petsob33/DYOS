<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DYOS is a relationship operating system for couples: timeline, memories, quests and tools to strengthen your relationship.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DYOS">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>DYOS – relationship OS for couples</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Maps JavaScript API, required by google_maps_flutter_web for the
    "Add place" / "Memories map" screens. This key is restricted by HTTP
    referrer (dyos-520c2.web.app / firebaseapp.com) in Google Cloud Console,
    so - like any Maps JS key - it's safe to ship in client-side HTML; the
    referrer check, not secrecy, is what protects it.
  -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAostnGOc7KYdNthRf8YZPnqXk9d17XSc8" async></script>
  <style>
    :root {
      --dyos-bg: #f2f2f7;
      --dyos-card: #ffffff;
      --dyos-primary: #5e5ce6;
      --dyos-text: #1c1c1e;
      --dyos-secondary: #8e8e93;
    }

    body {
      margin: 0;
      background: var(--dyos-bg);
      color: var(--dyos-text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .site-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(142, 142, 147, 0.2);
      box-sizing: border-box;
    }

    .site-nav__brand {
      font-weight: 700;
      color: var(--dyos-text);
      text-decoration: none;
    }

    .site-nav__link {
      color: var(--dyos-primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--dyos-card);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
  </style>
</head>

<body>
  <nav class="site-nav" aria-label="Main navigation">
    <a class="site-nav__brand" href="/">DYOS</a>
    <a class="site-nav__link" href="/privacy-policy.html">Privacy Policy</a>
  </nav>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
