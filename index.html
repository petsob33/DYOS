    const { useState, useEffect } = React;

    // Lucide icons helper
    const Icon = ({ name, ...props }) => {
      const iconMap = {
        Heart: () => lucide.icons.heart,
        Calendar: () => lucide.icons.calendar,
        Zap: () => lucide.icons.zap,
        Lock: () => lucide.icons.lock,
        ArrowRight: () => lucide.icons.arrowRight,
        Check: () => lucide.icons.check,
        Share2: () => lucide.icons.share2,
        Activity: () => lucide.icons.activity,
      };

      useEffect(() => {
        const iconFunc = iconMap[name];
        if (iconFunc) {
          const iconElement = iconFunc();
          if (iconElement && document.getElementById(`icon-${name}`)) {
            iconElement.mount(document.getElementById(`icon-${name}`));
          }
        }
      }, [name]);

      return React.createElement('i', { id: `icon-${name}`, ...props });
    };

    function DyosLandingPage() {
      const [email, setEmail] = useState('');
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitStatus, setSubmitStatus] = useState(null);
      const [isScrolled, setIsScrolled] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 20);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const validateEmail = (email) => {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      };

      const handleSubmit = async (e) => {
        e.preventDefault();

        if (!email) {
          setSubmitStatus({ type: 'error', message: 'Please enter your email' });
          return;
        }

        if (!validateEmail(email)) {
          setSubmitStatus({ type: 'error', message: 'Invalid email address' });
          return;
        }

        setIsSubmitting(true);
        setSubmitStatus(null);

        try {
          // Wait for Firebase to be initialized
          if (!window.firebaseDb) {
            await new Promise((resolve) => {
              const checkFirebase = setInterval(() => {
                if (window.firebaseDb) {
                  clearInterval(checkFirebase);
                  resolve();
                }
              }, 100);

              // Timeout after 5 seconds
              setTimeout(() => {
                clearInterval(checkFirebase);
                resolve();
              }, 5000);
            });
          }

          if (!window.firebaseDb) {
            throw new Error('Firebase not initialized. Please refresh the page.');
          }

          const db = window.firebaseDb;

          // Normalize email (lowercase) and use as document ID to prevent duplicates
          const normalizedEmail = email.toLowerCase().trim();

          // Check if email already exists
          const existingDoc = await db.collection('waitlist').doc(normalizedEmail).get();

          if (existingDoc.exists) {
            setSubmitStatus({
              type: 'success',
              message: 'You\'re already on the waitlist!'
            });
            setEmail('');
            setTimeout(() => setSubmitStatus(null), 5000);
            setIsSubmitting(false);
            return;
          }

          // Save to Firestore
          await db.collection('waitlist').doc(normalizedEmail).set({
            email: normalizedEmail,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            source: 'landing_page',
            userAgent: navigator.userAgent,
            timestamp: new Date().toISOString()
          });

          setSubmitStatus({
            type: 'success',
            message: 'Successfully joined the waitlist!'
          });
          setEmail('');

          setTimeout(() => setSubmitStatus(null), 5000);
        } catch (error) {
          console.error('Waitlist signup error:', error);

          // Handle specific Firebase errors
          if (error.code === 'permission-denied') {
            setSubmitStatus({
              type: 'error',
              message: 'Permission denied. Please check Firestore rules are deployed.'
            });
          } else if (error.code === 'unavailable') {
            setSubmitStatus({
              type: 'error',
              message: 'Service temporarily unavailable. Please try again later.'
            });
          } else {
            setSubmitStatus({
              type: 'error',
              message: error.message || 'Something went wrong. Please try again later.'
            });
          }
        } finally {
          setIsSubmitting(false);
        }
